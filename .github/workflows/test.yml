name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - name: Check the web app in Chrome
        timeout-minutes: 2
        env:
          PRP_SCREENSHOTS: ${{ runner.temp }}/prp-screenshots
        run: node --experimental-websocket scripts/check-browser.js

      - name: Save Today screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-screenshots
          path: ${{ runner.temp }}/prp-screenshots/today-*.png
          if-no-files-found: ignore

      - name: Save Directions, Ideas and Calendar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directions-ideas-calendar-screenshots
          path: ${{ runner.temp }}/prp-screenshots/work-*.png
          if-no-files-found: ignore
